<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="format-detection" content="telephone=no, address=no, email=no">
<title>새 주소로 바뀌었어요</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f1eefc;color:#3a3560}
.box{max-width:380px;margin:20px;padding:26px 22px;background:#fff;border-radius:24px;box-shadow:0 10px 28px rgba(110,100,180,.18);text-align:center}
h1{font-size:1.3rem;margin:0 0 10px}
p{margin:6px 0;line-height:1.6}
ol{text-align:left;margin:14px 0;padding-left:22px;line-height:1.8}
.addr{margin-top:14px;padding:12px 10px;border-radius:14px;background:#f1eefc;border:2px dashed #a79be0;font-size:.95rem;word-break:break-all;user-select:all;-webkit-user-select:all;color:#3a3560}
.btn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:16px;background:linear-gradient(90deg,#6b8fe0,#a07be0);color:#fff;font:inherit;font-size:1.1rem}
.btn:active{transform:scale(.98)}
small{display:block;margin-top:12px;color:#7d7aa3;line-height:1.5}
</style></head>
<body><div class="box">
<h1>📢 이 바로가기는 이제 안 써요</h1>
<p>일당직표·연차달력·이수증이<br><b>'은빛도담' 새 주소 하나</b>로 모였어요.</p>
<ol>
<li>폰 화면의 <b>이 아이콘은 꾹 눌러서 지워 주세요.</b></li>
<li>아래 <b>주소 복사</b>를 눌러요.</li>
<li>사파리(아이폰) 또는 크롬(안드로이드)을 열어 <b>주소창에 붙여넣기</b> 해요.</li>
<li>내 코드를 한 번 넣고, <b>'홈 화면에 추가'</b>로 새 아이콘을 만들어요.</li>
</ol>
<div class="addr" id="a">akj387-hub.github.io/eunbit/</div>
<button class="btn" id="b" type="button">주소 복사</button>
<small>복사가 안 되면 위 주소를 길게 눌러 복사해 주세요.</small>
</div>
<script>
document.getElementById("b").onclick = function () {
  var t = "https://akj387-hub.github.io/eunbit/", b = this;
  function ok() { b.textContent = "✅ 복사됐어요! 주소창에 붙여넣어 주세요"; }
  function fb() {
    var r = document.createRange(); r.selectNodeContents(document.getElementById("a"));
    var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    try { document.execCommand("copy") ? ok() : (b.textContent = "주소를 길게 눌러 복사해 주세요"); } catch (e) { b.textContent = "주소를 길게 눌러 복사해 주세요"; }
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, fb); else fb();
};
</script>
</body></html>
