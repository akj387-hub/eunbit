<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은빛도담 바로가기</title>
<style>
  :root{--bg:#f6f7f2;--paper:#fff;--ink:#23281f;--muted:#69715f;--line:#dfe3d6}
  @media (prefers-color-scheme:dark){:root{--bg:#161a14;--paper:#1f241c;--ink:#e7eadf;--muted:#a2aa96;--line:#353c2f}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:420px;margin:0 auto;padding:32px 16px;display:grid;gap:12px}
  h1{margin:0 0 6px;font-size:1.4rem}
  a{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:inherit;text-decoration:none;font-size:1.1rem;font-weight:700}
  a img{width:52px;height:52px;border-radius:12px}
</style>
</head>
<body>
<main>
  <h1>은빛도담어린이집</h1>
  <a href="duty/"><img src="duty/icon-192.png" alt="">일당직표</a>
  <a href="leave/"><img src="leave/icon-192.png" alt="">연차달력</a>
</main>
</body>
</html>
